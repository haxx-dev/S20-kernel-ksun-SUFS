name: Build Kernel x1s (LineageOS 23.2) - KSUN + SUSFS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Instalar dependências
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex build-essential libssl-dev \
          python3 python3-pip zip wget curl git libelf-dev device-tree-compiler

    - name: Baixar Clang (AOSP)
      run: |
        # Clang oficial do AOSP (prebuilt para kernels Android)
        wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r510928.tar.gz" -O clang.tar.gz
        mkdir -p $HOME/toolchain
        tar -xzf clang.tar.gz -C $HOME/toolchain
        echo "$HOME/toolchain/bin" >> $GITHUB_PATH
        $HOME/toolchain/bin/clang --version

    - name: Clonar kernel (LineageOS 23.2)
      run: |
        git clone --depth=1 -b lineage-23.2 \
          https://github.com/LineageOS/android_kernel_samsung_universal9830.git kernel-source

    - name: Verificar defconfig
      working-directory: ./kernel-source
      run: |
        DEFCONFIG="exynos990-x1s_defconfig"
        if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
          echo "❌ Defconfig '$DEFCONFIG' não encontrada!"
          ls -1 arch/arm64/configs/ | grep -i exynos990
          exit 1
        fi
        echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV

    - name: Integrar KernelSU-Next
      working-directory: ./kernel-source
      run: |
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

    - name: Integrar SUSFS (kernel 4.19)
      working-directory: ./kernel-source
      run: |
        git clone --depth=1 -b kernel-4.19 \
          https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu

        # Copiar arquivos do SUSFS para a source
        cp -r /tmp/susfs4ksu/kernel_patches/fs/* ./fs/ 2>/dev/null || true
        cp -r /tmp/susfs4ksu/kernel_patches/include/linux/* ./include/linux/ 2>/dev/null || true

        # Aplicar patch principal (|| true para não travar o workflow)
        patch -p1 --forward < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true

        # Aplicar patch do KernelSU-Next (se existir)
        for p in /tmp/susfs4ksu/kernel_patches/next/kernel-patch-susfs-v*.patch; do
          [ -f "$p" ] && patch -p1 --forward < "$p" || true
        done

        echo "📋 Rejeitos encontrados:"
        find . -name "*.rej" -type f | head -10 || echo "Nenhum"

    - name: Compilar kernel
      working-directory: ./kernel-source
      env:
        ARCH: arm64
        SUBARCH: arm64
        CC: clang
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        LLVM: 1
        LLVM_IAS: 1
      run: |
        make O=out ARCH=arm64 "$DEFCONFIG"
        make -j$(nproc) O=out ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 LLVM_IAS=1

        [ -f "out/arch/arm64/boot/Image" ] || exit 1
        echo "✅ Kernel compilado"

    - name: Empacotar AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
        rm -rf anykernel/ak3-helper.sh anykernel/anykernel.sh anykernel/banner
        cp kernel-source/out/arch/arm64/boot/Image anykernel/Image

        cd anykernel
        ZIP_NAME="Kernel-x1s-LOS23.2-KSUN-SUSFS-$(date +%Y%m%d).zip"
        zip -r9 "$ZIP_NAME" * -x "*.zip"
        echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
        mv "$ZIP_NAME" ../

    - name: Upload artefato
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-x1s-KSUN-SUSFS
        path: ${{ env.ZIP_NAME }}
        retention-days: 7
