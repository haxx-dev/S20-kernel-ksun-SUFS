name: Build S20 Kernel (LineageOS base + KernelSU-Next + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc kmod cpio \
            libssl-dev libncurses-dev rsync unzip zip python3

      - name: Download correct kernel source (paired with LineageOS 23.2)
        run: |
          mkdir -p kernel-source
          curl -L https://github.com/LineageOS/android_kernel_samsung_universal9830/archive/refs/heads/lineage-23.2.tar.gz | tar xz --strip-components=1 -C kernel-source

      - name: Download reference source (already has KernelSU-Next + SUSFS integrated)
        run: |
          mkdir -p patched-ref
          curl -L https://github.com/enchantedglycerin/exynos990-KernelSU-Next-SuSFS/archive/refs/heads/main.tar.gz | tar xz --strip-components=1 -C patched-ref

      - name: Download Clang toolchain (r370808)
        run: |
          mkdir -p tc/clang10
          curl -L https://github.com/Nicklas373/aosp-clang/archive/refs/heads/r370808.tar.gz | tar xz --strip-components=1 -C tc/clang10

      - name: Download GCC toolchain
        run: |
          mkdir -p tc/gcc49
          curl -L https://github.com/GrowtopiaJaw/aarch64-linux-android-4.9/archive/refs/heads/google.tar.gz | tar xz --strip-components=1 -C tc/gcc49

      - name: Transplant KernelSU-Next + SUSFS files onto the correct base
        run: |
          cd kernel-source
          rm -rf KernelSU-Next
          cp -r ../patched-ref/KernelSU-Next .

          for f in fs/Makefile fs/dcache.c fs/namei.c fs/namespace.c \
                   fs/notify/fdinfo.c fs/overlayfs/inode.c fs/overlayfs/readdir.c fs/overlayfs/super.c \
                   fs/proc/cmdline.c fs/proc/fd.c fs/proc/task_mmu.c fs/proc_namespace.c \
                   fs/readdir.c fs/stat.c fs/statfs.c fs/susfs.c \
                   fs/exec.c fs/open.c fs/read_write.c \
                   include/linux/mount.h include/linux/sched.h \
                   kernel/kallsyms.c kernel/sys.c \
                   drivers/input/input.c; do
            if [ -f "../patched-ref/$f" ]; then
              mkdir -p "$(dirname "$f")"
              cp "../patched-ref/$f" "$f"
            fi
          done

          echo "=== Makefile RAIZ ==="
          grep -n "KernelSU" ../patched-ref/Makefile || echo "(nada encontrado)"
          echo "=== Kconfig RAIZ ==="
          grep -n "KernelSU" ../patched-ref/Kconfig || echo "(nada encontrado)"
          echo "=== drivers/Makefile ==="
          grep -n "KernelSU" ../patched-ref/drivers/Makefile || echo "(nada encontrado)"
          echo "=== drivers/Kconfig (com contexto) ==="
          grep -n -B3 -A3 "KernelSU" ../patched-ref/drivers/Kconfig || echo "(nada encontrado)"
          echo "=== busca ampla em TODO o repo por source.*KernelSU ==="
          grep -rn "source.*KernelSU" ../patched-ref/ || echo "(nada encontrado)"

          if [ -f ../patched-ref/arch/arm64/configs/ksu.config ]; then
            cat ../patched-ref/arch/arm64/configs/ksu.config >> arch/arm64/configs/x1slte.config
          fi
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/x1slte.config

      - name: Build kernel
        working-directory: kernel-source
        run: |
          export PATH="$GITHUB_WORKSPACE/tc/clang10/bin:$GITHUB_WORKSPACE/tc/gcc49/bin:$PATH"
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-android- exynos9830-x1slte_defconfig
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-android- -j$(nproc)

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: kernel-lineage-base-g980f
          path: |
            kernel-source/out/arch/arm64/boot/Image
            kernel-source/out/.config
