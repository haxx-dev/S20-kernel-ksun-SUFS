name: Build KernelSU Next + SUSFS (SM-G980F AOSP 16)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev libelf-dev libsqlite3-dev ccache zip curl git python3

      - name: 🧰 Baixando Toolchain (Proton Clang Direto)
        run: |
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz -O proton.tar.gz
          tar -xf proton.tar.gz
          mv proton-clang-master toolchain


      - name: Integrate KernelSU Next & SUSFS
        run: |
          # 1. Clonar KernelSU Next direto na pasta drivers
          git clone https://github.com/rifs31/KernelSU-Next drivers/kernelsu -b next || git clone https://github.com/rifs31/KernelSU-Next drivers/kernelsu

          # Adicionar drivers/kernelsu no Kconfig e Makefile do kernel (se já não estiver lá)
          grep -q "CONFIG_KSU" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "CONFIG_KSU" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # 2. Baixar e copiar patches do SUSFS
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.4 susfs_src || true
          cp -r susfs_src/kernel_patches/fs/* fs/ || true
          cp -r susfs_src/kernel_patches/include/linux/* include/linux/ || true

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1

          # 1. Gera o .config base
          # IMPORTANTE: Altere "exynos990-g980f_defconfig" se o nome na pasta arch/arm64/configs/ for outro
          make O=out exynos990-g980f_defcobase

          # 2. Ativa flags essenciais para KernelSU Next e SUSFS
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_SUSFS=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> out/.config

          # 3. Compilação
          make -j$(nproc) O=out

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3

          # Procura a imagem copiada do build e move para o AnyKernel3
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AK3/Image.gz-dtb
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz AK3/Image.gz
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image AK3/Image
          else
            echo "Erro: Imagem do Kernel não encontrada em out/arch/arm64/boot/"
            exit 1
          fi

          cd AK3
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.1\/by-name\/boot;/block=auto;/g' anykernel.sh
          zip -r9 ../KernelSU-Next-SUSFS-SMG980F-AOSP16.zip ./* -x .git\* README.md *placeholder

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-SUSFS-AOSP16-SMG980F
          path: KernelSU-Next-SUSFS-SMG980F-AOSP16.zip
