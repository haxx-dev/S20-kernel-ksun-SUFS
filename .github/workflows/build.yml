name: Build KernelSU Next + SUSFS (AOSP Android 16 - SM-G980F)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev libelf-dev libsqlite3-dev ccache zip curl git python3

      - name: Download Toolchains
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p toolchain
          
          # Clona o Clang r488900 oficial via espelho no GitHub
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r488900 toolchain/clang
          
          # Clona GCC para arquiteturas cruzadas (aarch64 e arm)
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain/gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_arm_arm-linux-androideabi-4.9 toolchain/gcc32


      - name: Integrate KernelSU Next & SUSFS
        run: |
          # KernelSU Next Setup
          curl -LSs "https://raw.githubusercontent.com/rifs31/KernelSU-Next/next/kernel/setup.sh" | bash -s next

          # SUSFS Patches
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.4 susfs_src || true
          cp -r susfs_src/kernel_patches/fs/* fs/ || true
          cp -r susfs_src/kernel_patches/include/linux/* include/linux/ || true

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          # Defconfig AOSP do S20 Exynos (Altere o nome se no seu repo for diferente)
          make O=out exynos990-g980f_defconfig

          # Configs essenciais para KSU Next + SUSFS
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_SUSFS=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> out/.config

          make -j$(nproc) O=out

      - name: Package with AnyKernel3
        run: |
          # Clona o AnyKernel3
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          # Procura a imagem copiada do build e move para o AK3
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AK3/Image.gz-dtb
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz AK3/Image.gz
          else
            cp out/arch/arm64/boot/Image AK3/Image
          fi

          # Ajusta para a partição do SM-G980F no anykernel.sh
          cd AK3
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.1\/by-name\/boot;/block=auto;/g' anykernel.sh
          zip -r9 ../KernelSU-Next-SUSFS-SMG980F-AOSP16.zip ./* -x .git\* README.md *placeholder

      - name: Verify Zip Creation
        run: |
          if [ -f "KernelSU-Next-SUSFS-SMG980F-AOSP16.zip" ]; then
            echo "Zip do AnyKernel3 gerado com sucesso!"
          else
            echo "Erro ao gerar o Zip do AnyKernel3!"
            exit 1
          fi

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-SUSFS-AOSP16-SMG980F
          path: KernelSU-Next-SUSFS-SMG980F-AOSP16.zip
