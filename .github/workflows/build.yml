name: Build S20 kernel (KSU Next + SUSFS)

on:
  workflow_dispatch:

env:
  KERNEL_REPO: "https://github.com/LineageOS/android_kernel_samsung_universal9830"
  KERNEL_COMMIT: "97369af7bbd66581d3e993fea083f3eed02d3c20"
  DEFCONFIG: "exynos9830_defconfig x1s.config ksu.config"
  MAKE_ARGS: "ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
  CLANG_REPO: "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b"
  CLANG_BRANCH: "lineage-20.0"
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Liberar espaco e instalar dependencias
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            cpio zip curl git python3 lz4 ccache gcc-aarch64-linux-gnu

      - name: Baixar fonte do kernel
        run: |
          mkdir kernel && cd kernel
          git init
          git remote add origin "$KERNEL_REPO"
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout FETCH_HEAD

      - name: Baixar toolchain (clang do Lineage)
        run: |
          git clone --depth=1 -b "$CLANG_BRANCH" "$CLANG_REPO" toolchain
          echo "$PWD/toolchain/bin" >> "$GITHUB_PATH"

      - name: Adicionar KernelSU-Next (branch legacy)
        working-directory: kernel
        run: |
          set -o pipefail
          curl -fLSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy 2>&1 | tee ksu_setup.log
          if grep -q "Checkout default branch" ksu_setup.log; then
            echo "ERRO: a branch legacy nao existe, caiu na padrao"
            exit 1
          fi
          for d in KernelSU*; do echo "$d"; git -C "$d" branch --show-current; done

      - name: Inspecionar hooks do KSU Next e pontos de insercao
        working-directory: kernel
        run: |
          echo "=== hooks que o KSU Next define (assinaturas) ==="
          grep -rn "ksu_handle_" KernelSU-Next/kernel --include=*.h --include=*.c | head -40 || true
          echo "=== patches ou docs de hook dentro do repo do KSU ==="
          find KernelSU-Next -maxdepth 3 \( -iname "*.patch" -o -iname "*hook*" \) -not -path "*/.git/*" | head -30 || true
          echo "=== kernel/reboot.c ==="
          grep -n -E "ksu_|SYSCALL_DEFINE4\(reboot" kernel/reboot.c || true
          sed -n '/SYSCALL_DEFINE4(reboot/,+22p' kernel/reboot.c || true
          echo "=== fs/exec.c 1900-1970 ==="
          sed -n 1900,1970p fs/exec.c || true
          echo "=== fs/open.c 348-372 ==="
          sed -n 348,372p fs/open.c || true
          echo "=== fs/read_write.c: vfs_read e sys_read ==="
          sed -n 441,458p fs/read_write.c || true
          grep -n -E "SYSCALL_DEFINE3\(read," fs/read_write.c || true
          echo "=== fs/stat.c: vfs_statx e newfstatat ==="
          sed -n 166,185p fs/stat.c || true
          sed -n 357,375p fs/stat.c || true
          sed -n 507,525p fs/stat.c || true
          echo "=== drivers/input/input.c: input_event ==="
          sed -n '/^void input_event/,+18p' drivers/input/input.c || true
          echo "=== fim da inspecao ==="

      - name: Aplicar hooks e patch do SUSFS
        working-directory: kernel
        run: |
          echo "TODO: hooks manuais + SUSFS"

      - name: Configurar
        working-directory: kernel
        run: |
          make O=out $MAKE_ARGS $DEFCONFIG
          make O=out $MAKE_ARGS olddefconfig
          grep -E "CONFIG_KPROBES|CONFIG_KSU|CONFIG_MODEL_X1S" out/.config || true
          grep -q "^CONFIG_KSU=y" out/.config || { echo "ERRO: CONFIG_KSU nao entrou"; exit 1; }

      - name: Compilar
        working-directory: kernel
        run: |
          set -o pipefail
          make O=out $MAKE_ARGS -j"$(nproc)" 2>&1 | tee build.log

      - name: Mostrar erros da compilacao
        if: failure()
        working-directory: kernel
        run: |
          echo "=== linhas com erro ==="
          grep -n -i -E "error|\*\*\*|fatal|undefined|No rule" build.log | head -40 || true
          echo "=== final do log ==="
          tail -n 40 build.log || true

      - name: Empacotar com AnyKernel3
        run: |
          git clone --depth=1 "$ANYKERNEL_REPO" ak3
          cp kernel/out/arch/arm64/boot/Image ak3/
          cd ak3 && zip -r9 ../kernel-ksunext-susfs.zip . -x ".git*"

      - name: Enviar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            kernel-ksunext-susfs.zip
            kernel/build.log
