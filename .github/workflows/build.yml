name: Build Kernel for LineageOS 23.2 - x1s (KSUN+SUSFS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig'
        required: true
        default: 'exynos990-x1s_defconfig'
        type: string
      clang_url:
        description: 'Clang 下载链接'
        required: true
        default: 'https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/clang+llvm-19.1.7-x86_64-linux-gnu-ubuntu-22.04.tar.xz'
        type: string

env:
  KERNEL_REPO: 'https://github.com/LineageOS/android_kernel_samsung_universal9830.git'
  KERNEL_BRANCH: 'lineage-23.2'
  DEFAULT_DEFCONFIG: 'exynos990-x1s_defconfig'
  DEFAULT_CLANG_URL: 'https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/clang+llvm-19.1.7-x86_64-linux-gnu-ubuntu-22.04.tar.xz'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Instalar dependências
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex build-essential libssl-dev \
          python3 python3-pip zip wget curl git libelf-dev device-tree-compiler

    - name: Baixar Clang
      env:
        CLANG_URL: ${{ github.event.inputs.clang_url || env.DEFAULT_CLANG_URL }}
      run: |
        echo "🔧 Baixando Clang de: $CLANG_URL"
        wget -q "$CLANG_URL" -O clang.tar.xz
        mkdir -p $HOME/toolchain
        tar -xf clang.tar.xz -C $HOME/toolchain --strip-components=1
        echo "$HOME/toolchain/bin" >> $GITHUB_PATH
        $HOME/toolchain/bin/clang --version

    - name: Clonar kernel (lineage-23.2)
      run: |
        git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel-source
        cd kernel-source
        echo "📋 Defconfigs disponíveis (exynos990):"
        ls arch/arm64/configs/ | grep -i exynos990 || ls arch/arm64/configs/ | head -20

    - name: Verificar defconfig
      working-directory: ./kernel-source
      env:
        DEFCONFIG: ${{ github.event.inputs.defconfig || env.DEFAULT_DEFCONFIG }}
      run: |
        echo "🔎 Verificando defconfig: $DEFCONFIG"
        if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
          echo "❌ Defconfig '$DEFCONFIG' não encontrada!"
          echo "📋 Disponíveis:"
          ls -1 arch/arm64/configs/
          exit 1
        fi
        echo "✅ Defconfig OK"
        echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV

    - name: Integrar KernelSU-Next
      working-directory: ./kernel-source
      run: |
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
        echo "✅ KernelSU-Next integrado"

    - name: Integrar SUSFS (kernel 4.19)
      working-directory: ./kernel-source
      run: |
        git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu

        cp -r /tmp/susfs4ksu/kernel_patches/fs/* ./fs/ 2>/dev/null || true
        cp -r /tmp/susfs4ksu/kernel_patches/include/linux/* ./include/linux/ 2>/dev/null || true

        patch -p1 --forward < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true

        KSU_PATCH="/tmp/susfs4ksu/kernel_patches/next/kernel-patch-susfs-v*.patch"
        for p in $KSU_PATCH; do
          [ -f "$p" ] && patch -p1 --forward < "$p" || true
        done

        echo "📋 Arquivos .rej gerados (se houver):"
        find . -name "*.rej" -type f | head -10 || echo "Nenhum .rej"

    - name: Compilar kernel
      working-directory: ./kernel-source
      env:
        ARCH: arm64
        SUBARCH: arm64
        CC: clang
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        LLVM: 1
        LLVM_IAS: 1
      run: |
        echo "🛠️ Compilando com defconfig: $DEFCONFIG"
        make O=out ARCH=arm64 "$DEFCONFIG"
        make -j$(nproc) O=out ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 LLVM_IAS=1

        if [ -f "out/arch/arm64/boot/Image" ]; then
          echo "✅ Kernel compilado com sucesso"
        else
          echo "❌ Image não encontrada"
          exit 1
        fi

    - name: Empacotar AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
        rm -rf anykernel/ak3-helper.sh anykernel/anykernel.sh anykernel/banner
        cp kernel-source/out/arch/arm64/boot/Image anykernel/Image

        cd anykernel
        ZIP_NAME="Kernel-x1s-LOS23.2-KSUN-SUSFS-$(date +%Y%m%d).zip"
        zip -r9 "$ZIP_NAME" * -x "*.zip"
        echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
        mv "$ZIP_NAME" ../

    - name: Upload artefato
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-x1s-KSUN-SUSFS
        path: ${{ env.ZIP_NAME }}
        retention-days: 7
