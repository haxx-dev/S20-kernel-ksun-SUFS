name: Build S20 kernel (KSU Next + SUSFS)

on:
  workflow_dispatch:

env:
  KERNEL_REPO: "https://github.com/LineageOS/android_kernel_samsung_universal9830"
  KERNEL_COMMIT: "97369af7bbd66581d3e993fea083f3eed02d3c20"
  DEFCONFIG: "exynos9830_defconfig x1s.config ksu.config"
  MAKE_ARGS: "ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
  CLANG_REPO: "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b"
  CLANG_BRANCH: "lineage-20.0"
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Liberar espaco e instalar dependencias
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            cpio zip curl git python3 lz4 ccache gcc-aarch64-linux-gnu

      - name: Baixar fonte do kernel
        run: |
          mkdir kernel && cd kernel
          git init
          git remote add origin "$KERNEL_REPO"
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout FETCH_HEAD

      - name: Baixar toolchain (clang do Lineage)
        run: |
          git clone --depth=1 -b "$CLANG_BRANCH" "$CLANG_REPO" toolchain
          echo "$PWD/toolchain/bin" >> "$GITHUB_PATH"

      - name: Conferir ferramentas LLVM do toolchain
        run: |
          fail=
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            if [ -x "toolchain/bin/$t" ]; then echo "ok: $t"; else echo "FALTA: $t"; fail=1; fi
          done
          ld.lld --version || true
          [ -z "$fail" ] || exit 1

      - name: Adicionar KernelSU-Next (branch legacy)
        working-directory: kernel
        run: |
          set -o pipefail
          curl -fLSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy 2>&1 | tee ksu_setup.log
          if grep -q "Checkout default branch" ksu_setup.log; then
            echo "ERRO: a branch legacy nao existe, caiu na padrao"
            exit 1
          fi
          for d in KernelSU*; do echo "$d"; git -C "$d" branch --show-current; done

      - name: Inspecionar sulog capture
        working-directory: kernel
        run: |
          echo "=== ksu_sulog_capture ==="
          grep -n -A45 -E "^(static )?struct ksu_sulog_pending_event \*ksu_sulog_capture\(" KernelSU-Next/kernel/sulog/event.c | head -80 || true
          echo "=== fim da inspecao ==="

      - name: Hook manual 1 - kernel/reboot.c
        working-directory: kernel
        run: |
          python3 - <<'PY'
          import sys
          p = "kernel/reboot.c"
          s = open(p).read()
          if "ksu_handle_sys_reboot" in s:
              print("hook do reboot ja existe")
              sys.exit(0)
          a1 = "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,"
          if s.count(a1) != 1:
              sys.exit("ERRO: ancora do SYSCALL_DEFINE4(reboot) nao encontrada")
          decl = ("#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
                  "#endif\n\n")
          s = s.replace(a1, decl + a1)
          a2 = "\tchar buffer[256];\n\tint ret = 0;\n"
          if s.count(a2) != 1:
              sys.exit("ERRO: ancora das variaveis nao encontrada")
          call = ("\n#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
                  "#endif\n")
          s = s.replace(a2, a2 + call)
          open(p, "w").write(s)
          print("hook do reboot aplicado")
          PY

      - name: Hooks manuais 2 - faccessat, stat, read, input
        working-directory: kernel
        run: |
          python3 - <<'PY'
          import sys

          def patch(path, func_header, anchor, call, decl):
              s = open(path).read()
              if call.strip() in s:
                  print(path, "ja tem o hook")
                  return
              n = s.count(func_header)
              if n != 1:
                  sys.exit("ERRO: %s: cabecalho %r aparece %d vezes" % (path, func_header, n))
              start = s.index(func_header)
              pos = s.find(anchor, start)
              if pos == -1 or pos - start > 1500:
                  sys.exit("ERRO: %s: ancora %r nao achada perto da funcao" % (path, anchor))
              end = pos + len(anchor)
              s = s[:end] + call + s[end:]
              s = s[:start] + decl + s[start:]
              open(path, "w").write(s)
              print(path, "hook aplicado")

          IF = "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
          EI = "#endif\n"

          patch("fs/open.c",
                "long do_faccessat(int dfd, const char __user *filename, int mode)",
                "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n",
                "\n" + IF + "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n" + EI,
                IF + "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *__unused_flags);\n" + EI + "\n")

          patch("fs/read_write.c",
                "ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)",
                "\tssize_t ret;\n",
                "\n" + IF + "\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n" + EI,
                IF + "extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n" + EI + "\n")

          patch("fs/stat.c",
                "int vfs_statx(int dfd, const char __user *filename, int flags,",
                "\tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;\n",
                "\n" + IF + "\tksu_handle_stat(&dfd, &filename, &flags);\n" + EI,
                IF + "extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n" + EI + "\n")

          patch("drivers/input/input.c",
                "void input_event(struct input_dev *dev,",
                "\tunsigned long flags;\n",
                "\n" + IF + "\tksu_handle_input_handle_event(&type, &code, &value);\n" + EI,
                IF + "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n" + EI + "\n")
          PY

      - name: Hooks manuais 3 - exec e fstat
        working-directory: kernel
        run: |
          python3 - <<'PY'
          import sys

          def patch(path, header, anchor, text, decl, span=1500):
              s = open(path).read()
              if text.strip() in s:
                  print(path, "ja tem o hook")
                  return
              n = s.count(header)
              if n != 1:
                  sys.exit("ERRO: %s: cabecalho %r aparece %d vezes" % (path, header, n))
              start = s.index(header)
              pos = s.find(anchor, start)
              if pos == -1 or pos - start > span:
                  sys.exit("ERRO: %s: ancora %r nao achada perto da funcao" % (path, anchor))
              at = pos + len(anchor)
              s = s[:at] + text + s[at:]
              s = s[:start] + decl + s[start:]
              open(path, "w").write(s)
              print(path, "hook aplicado")

          IF = "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
          EI = "#endif\n"

          patch("fs/exec.c",
                "static int __do_execve_file(int fd, struct filename *filename,",
                "\tif (IS_ERR(filename))\n\t\treturn PTR_ERR(filename);\n",
                "\n" + IF + "\tif (filename)\n\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n" + EI,
                IF + "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n" + EI + "\n",
                span=1200)

          patch("fs/stat.c",
                "SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)",
                "\t\terror = cp_new_stat(&stat, statbuf);\n",
                "\n" + IF + "\tksu_handle_newfstat_ret(&fd, &statbuf);\n" + EI,
                IF + "extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n" + EI + "\n",
                span=400)

          patch("fs/stat.c",
                "SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)",
                "\t\terror = cp_new_stat64(&stat, statbuf);\n",
                "\n" + IF + "\tksu_handle_fstat64_ret(&fd, &statbuf);\n" + EI,
                IF + "extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n" + EI + "\n",
                span=400)
          PY
          git diff --stat

      - name: Aplicar patch do SUSFS
        working-directory: kernel
        run: |
          echo "TODO: SUSFS"

      - name: Configurar
        working-directory: kernel
        run: |
          make O=out $MAKE_ARGS $DEFCONFIG
          scripts/config --file out/.config -e KSU_MANUAL_HOOK
          make O=out $MAKE_ARGS olddefconfig
          grep -E "CONFIG_KPROBES|CONFIG_KSU|CONFIG_MODEL_X1S|CONFIG_LTO|CONFIG_LD_IS_LLD" out/.config || true
          grep -q "^CONFIG_KSU=y" out/.config || { echo "ERRO: CONFIG_KSU nao entrou"; exit 1; }
          grep -q "^CONFIG_KSU_MANUAL_HOOK=y" out/.config || { echo "ERRO: modo manual nao ligou"; exit 1; }

      - name: Comparar config completa com o boot.img oficial
        continue-on-error: true
        working-directory: kernel
        run: |
          if ! curl -fL -o /tmp/lineage_boot.img "https://mirrorbits.lineageos.org/full/x1s/20261016/boot.img"; then
            echo "nao consegui baixar o boot.img do Lineage; pulando a comparacao"
            exit 0
          fi
          ls -l /tmp/lineage_boot.img
          scripts/extract-ikconfig /tmp/lineage_boot.img > /tmp/lineage.config || true
          if [ ! -s /tmp/lineage.config ]; then echo "nao extraiu a config; pulando"; exit 0; fi
          grep -E '^(CONFIG_|# CONFIG_)' /tmp/lineage.config | sort > /tmp/a.txt
          grep -E '^(CONFIG_|# CONFIG_)' out/.config | sort > /tmp/b.txt
          echo "=== diferencas (< Lineage, > nosso), sem as linhas de KSU ==="
          diff /tmp/a.txt /tmp/b.txt | grep -v "CONFIG_KSU" | head -60 || true
          echo "=== fim da comparacao ==="

      - name: Conferir config contra a do Lineage
        working-directory: kernel
        run: |
          bad=
          for l in 'CONFIG_MODEL_X1S=y' 'CONFIG_LD_IS_LLD=y' 'CONFIG_LTO_CLANG=y' 'CONFIG_THINLTO=y' 'CONFIG_RELR=y' 'CONFIG_MODULES=y' 'CONFIG_CMDLINE_EXTEND=y' 'CONFIG_CMDLINE="androidboot.boot_devices=13100000.ufs cgroup_disable=pressure"' 'CONFIG_CLANG_VERSION=120005' '# CONFIG_KPROBES is not set'; do
            if grep -qxF "$l" out/.config; then echo "ok: $l"; else echo "DIFERE: $l"; bad=1; fi
          done
          [ -z "$bad" ] || { echo "ERRO: config diferente da do Lineage, parando antes de compilar"; exit 1; }

      - name: Compilar
        working-directory: kernel
        run: |
          set -o pipefail
          make O=out $MAKE_ARGS -j"$(nproc)" 2>&1 | tee build.log

      - name: Verificar kernel gerado
        working-directory: kernel
        run: |
          ls -l out/arch/arm64/boot/Image
          echo "Image original do Lineage: 42313744 bytes"
          cat out/include/config/kernel.release
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version" || true
          echo "--- config dentro do Image:"
          scripts/extract-ikconfig out/arch/arm64/boot/Image > /tmp/ours.config 2>/dev/null || true
          grep -E "^CONFIG_(KSU|KSU_MANUAL_HOOK|MODEL_X1S|LTO_CLANG|THINLTO)=" /tmp/ours.config || echo "ikconfig nao extraido"
          echo "--- hooks linkados (esperado: 8):"
          grep -E " ksu_handle_(execveat|sys_reboot|faccessat|stat|vfs_read|input_handle_event|newfstat_ret|fstat64_ret)$" out/System.map || true

      - name: Mostrar erros da compilacao
        if: failure()
        working-directory: kernel
        run: |
          echo "=== linhas com erro ==="
          grep -n -i -E "error|\*\*\*|fatal|undefined|No rule" build.log | head -40 || true
          echo "=== final do log ==="
          tail -n 40 build.log || true

      - name: Empacotar com AnyKernel3 (x1s, boot, sem A/B)
        run: |
          git clone --depth=1 "$ANYKERNEL_REPO" ak3
          rm -rf ak3/.git ak3/README.md
          cat > ak3/anykernel.sh <<'EOF'
          ### AnyKernel3 - KernelSU-Next legacy (manual hooks) - Galaxy S20 x1s
          properties() { '
          kernel.string=KernelSU-Next legacy for Galaxy S20 (x1s) on LineageOS 24
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=x1s
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          block=boot;
          for p in /dev/block/by-name/boot /dev/block/platform/13100000.ufs/by-name/boot /dev/block/bootdevice/by-name/boot; do
            if [ -e "$p" ]; then block=$p; break; fi;
          done;
          BLOCK=$block;
          is_slot_device=0;
          IS_SLOT_DEVICE=0;
          ramdisk_compression=auto;
          RAMDISK_COMPRESSION=auto;
          patch_vbmeta_flag=0;
          PATCH_VBMETA_FLAG=0;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          cd ak3 && zip -r9 ../kernel-ksunext-x1s.zip . -x ".git*"
          unzip -l ../kernel-ksunext-x1s.zip | tail -n 15

      - name: Enviar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            kernel-ksunext-x1s.zip
            kernel/build.log
