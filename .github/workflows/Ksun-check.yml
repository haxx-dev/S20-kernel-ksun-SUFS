name: Inspecionar KernelSU-Next legacy (uapi)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - name: Clonar
        run: |
          git clone https://github.com/KernelSU-Next/KernelSU-Next ksun
          cd ksun
          git checkout legacy
          ls

      - name: Numero da interface (uapi) em cada commit
        working-directory: ksun
        run: |
          echo "=== onde o define esta, no HEAD ==="
          git grep -n "define KERNEL_SU_UAPI_VERSION" HEAD || true
          echo "=== por commit da legacy (mais novo primeiro) ==="
          for c in $(git log legacy --since="2026-09-25" --format=%h); do
            out=$(git grep -h "define KERNEL_SU_UAPI_VERSION" "$c" | head -1)
            echo "$c  ${out:-?}"
          done
          echo "=== tags de referencia ==="
          for t in v3.4.0-legacy v3.4.1 v3.4.2; do
            out=$(git grep -h "define KERNEL_SU_UAPI_VERSION" "$t" | head -1)
            echo "$t  ${out:-?}"
          done

      - name: O que o ultimo commit mudou
        working-directory: ksun
        run: |
          echo "=== commit 0b17f242 ==="
          git show --stat --format='%h %s' 0b17f242 | head -30
          echo "=== arquivos que mudaram entre 465490a2 e o HEAD ==="
          git diff --stat 465490a2 0b17f242 | tail -20
          echo "=== diferenca nos arquivos dos hooks ==="
          git diff 465490a2 0b17f242 -- kernel/core/init.c kernel/runtime/ksud_integration.c kernel/supercall/supercall.c kernel/feature/sucompat.c | head -60
          echo "=== fim ==="
